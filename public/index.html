<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gemini Chatbot</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="chat-container">

    <h1>Assistant Chatbot </h1>

    <div id="messages" class="messages">
      <div class="message bot">
        Bonjour 👋 Je suis ton assistant Chatbot.
      </div>
    </div>

    <form id="chat-form" class="chat-form">

      <div class="tools-wrapper">

        <button
          id="tools-button"
          class="tools-button"
          type="button"
          aria-label="Ouvrir les outils"
        >
          +
        </button>

        <div id="tools-menu" class="tools-menu">

          <button id="file-button" type="button">
            📎 Ajouter des photos et fichiers
          </button>

          <button id="library-button" type="button">
            📚 Bibliothèque
          </button>

          <button id="deep-search-button" type="button">
            🔎 Recherche approfondie
          </button>

          <button id="web-search-button" type="button">
            🌐 Recherche sur le Web
          </button>

          <button id="image-button" type="button">
            🖼️ Créer une image
          </button>

        </div>

        <input
          id="file-input"
          type="file"
          accept="image/*,.pdf,.txt"
          hidden
        >

      </div>

      <input
        id="message-input"
        type="text"
        placeholder="Écris ton message..."
        autocomplete="off"
        required
      >

      <button type="submit">
        Envoyer
      </button>

    </form>

  </main>

  <script src="app.js"></script>

</body>
</html>
